<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nextere Smart Locker — AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0f1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: rgba(255,255,255,0.07);
    --accent: #00c896;
    --accent2: #0099ff;
    --text: #e8edf5;
    --text-muted: #7a8fa6;
    --user-bg: #003d66;
    --bot-bg: #0f1f2e;
    --radius: 16px;
  }

  body {
    font-family: 'IBM Plex Sans Thai', 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(0,200,150,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0,153,255,0.06) 0%, transparent 60%);
  }

  .container {
    width: 100%;
    max-width: 480px;
    height: 90vh;
    max-height: 780px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,200,150,0.1);
  }

  /* Header */
  .header {
    padding: 20px 24px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,200,150,0.3);
  }

  .header-info { flex: 1; }
  .header-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  .header-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }
  .status-text { font-size: 12px; color: var(--text-muted); }

  .header-logo {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .msg.bot .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 2px 8px rgba(0,200,150,0.25);
  }
  .msg.user .msg-avatar {
    background: var(--user-bg);
    border: 1px solid rgba(0,153,255,0.3);
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    font-weight: 400;
  }
  .msg.bot .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #004d80, #003d66);
    border: 1px solid rgba(0,153,255,0.2);
    border-top-right-radius: 4px;
    color: #d0e8ff;
  }

  .time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 4px;
  }
  .msg.user .time { text-align: right; }

  /* Typing indicator */
  .typing .bubble {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 18px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Suggestions */
  .suggestions {
    padding: 8px 16px 4px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .suggestions::-webkit-scrollbar { display: none; }
  .chip {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid rgba(0,200,150,0.25);
    background: rgba(0,200,150,0.05);
    color: var(--accent);
    font-size: 12px;
    font-family: inherit;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .chip:hover {
    background: rgba(0,200,150,0.15);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  /* Input */
  .input-area {
    padding: 12px 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }
  .input-row:focus-within {
    border-color: rgba(0,200,150,0.4);
    box-shadow: 0 0 0 3px rgba(0,200,150,0.08);
  }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 100px;
    min-height: 22px;
  }
  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #00a87e);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 2px 10px rgba(0,200,150,0.3);
  }
  .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(0,200,150,0.4); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 18px; height: 18px; fill: #fff; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    opacity: 0.6;
  }
</style>
</head>

  const avatar = role === 'bot' ? '🤖' : '👤';

    <div>
      <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
      <div class="time">${getTime()}</div>
    </div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage(text) {
  const msg = text || inputEl.value.trim();
  if (!msg || isLoading) return;

  inputEl.value = '';
  autoResize(inputEl);
  isLoading = true;
  sendBtn.disabled = true;

  addMessage(msg, 'user');
  showTyping();

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chatInput: msg, sessionId })
    });
    const data = await res.json();
    removeTyping();
    const reply = data.output || data.text || data.message || 'ขออภัย ไม่สามารถตอบได้ในขณะนี้';
    addMessage(reply, 'bot');
  } catch (e) {
    removeTyping();
    addMessage('ขออภัย เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้งครับ', 'bot');
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

function sendQuick(text) {
  sendMessage(text);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
</script>
